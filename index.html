<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🛍️ ShopZone</h1>

        <nav>
            <button onclick="showHome()">Home</button>
            <button onclick="showProducts()">Products</button>
            <button onclick="showCart()">Cart 🛒 (<span id="cartCount">0</span>)</button>
        </nav>
    </header>

    <main>

        <!-- HOME -->
        <section id="home">
            <h2>Welcome to ShopZone</h2>
            <p>Simple and easy online shopping.</p>

            <button onclick="showProducts()" class="shop-btn">
                Shop Now
            </button>
        </section>


        <!-- PRODUCTS -->
        <section id="products">

            <h2>Products</h2>

            <input
                type="text"
                id="search"
                placeholder="Search product..."
                oninput="displayProducts()"
            >

            <div id="productList"></div>

        </section>


        <!-- CART -->
        <section id="cart">

            <h2>Shopping Cart 🛒</h2>

            <div id="cartList"></div>

            <h2>Total: ₹<span id="total">0</span></h2>

        </section>

    </main>


    <footer>
        <p>© 2026 ShopZone</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
